<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>SIAI Tucumán - Iniciar sesión</title>

    <style>
        :root {
            --ink: #102a43;
            --muted: #627d98;
            --accent: #0f766e;
            --accent-dark: #115e59;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--ink);
            background-color: #d9e8e7;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(7, 35, 48, 0.38);
        }

        .login-main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 3rem 1rem;
        }

        .login-card {
            width: min(100%, 430px);
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 24px 60px rgba(7, 35, 48, 0.25);
        }

        .login-mark {
            display: grid;
            width: 72px;
            height: 72px;
            margin: 0 auto 1.25rem;
            place-items: center;
            border-radius: 50%;
            background: #d8f3ef;
        }

        .login-mark img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .login-heading {
            margin-bottom: 0.4rem;
            font-size: clamp(1.7rem, 4vw, 2.2rem);
            font-weight: 700;
            text-align: center;
        }

        .login-subtitle {
            margin-bottom: 2rem;
            color: var(--muted);
            text-align: center;
        }

        .form-label {
            font-weight: 600;
        }

        .input-group-text {
            color: var(--accent);
            background: #f5faf9;
            border-color: #cbd5e1;
        }

        .form-control {
            min-height: 48px;
            border-color: #cbd5e1;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 0.2rem rgba(15, 118, 110, 0.16);
        }

        .login-button {
            min-height: 48px;
            border: 0;
            background: var(--accent);
        }

        .login-button:hover,
        .login-button:focus {
            background: var(--accent-dark);
        }

        .login-footer {
            color: rgba(255, 255, 255, 0.9);
        }
    </style>
<link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
                <img src="/image/logogota..png" alt="Logo SIAI Tucumán" class="me-2" style="width: 35px; height: 35px;">
                SIAI Tucumán
            </a>
            <a class="btn btn-outline-light btn-sm" href="index.html">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
    </nav>

    <main class="login-main">
        <form class="login-card" aria-labelledby="login-title">
            <div class="login-mark">
                <img src="/image/logogota..png" alt="">
            </div>

            <h1 id="login-title" class="login-heading">Bienvenido</h1>
            <p class="login-subtitle">Iniciá sesión para continuar al sistema SIAI.</p>

            <div class="mb-3">
                <label class="form-label" for="usuario">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                    <input class="form-control" type="text" id="usuario" placeholder="Ingresá tu usuario" autocomplete="username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                    <input class="form-control" type="password" id="password" placeholder="Ingresá tu contraseña" autocomplete="current-password" required>
                </div>
            </div>

            <button type="submit" id="btn-login" class="login-button btn btn-primary w-100">
                Ingresar <i class="bi bi-box-arrow-in-right ms-1" aria-hidden="true"></i>
            </button>
        </form>
    </main>

    <footer class="login-footer">
        <div class="text-center py-3">
            <img src="/image/logogota..png" alt="Logo SIAI Tucumán" class="me-1" style="width: 25px; height: 25px;">
            &copy; 2026 SIAI Tucumán. Todos los derechos reservados.
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="../js/login.js"></script>

</body>

</html>
