<!DOCTYPE html>

<html lang="es">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIAI - Nueva Alerta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <link rel="stylesheet" href="responsive.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">


        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="index.html">

                <img src="../image/logogota..png" alt="Logo SIAI Tucumán"
                    style="width: 35px; height: 35px; margin-right: 8px;">

                SIAI Tucumán

            </a>

            <button class="navbar-toggler" id="btn-alerta" data-bs-toggle="collapse" data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>



    </nav>

    <main class="container py-5">


        <div class="card shadow-sm">

            <div class="card-body">

                <h1 class="h3 mb-4">
                    <i class="bi bi-exclamation-triangle"></i>
                    Nueva alerta
                </h1>

                <form id="formAlerta">


                    <div class="mb-3">

                        <label for="tipo" class="form-label">
                            Tipo de alerta
                        </label>

                        <select class="form-select" id="tipo" required>

                            <option value="">
                                Seleccionar alerta
                            </option>

                            <option value="ROJA">
                                ALERTA ROJA
                            </option>

                            <option value="NARANJA">
                                ALERTA NARANJA
                            </option>

                            <option value="AMARILLA">
                                ALERTA AMARILLA
                            </option>

                        </select>

                    </div>



                    <div class="mb-3">

                        <label for="titulo" class="form-label">
                            Título
                        </label>

                        <input type="text" class="form-control" id="titulo" placeholder="Ej: Nivel de agua crítico"
                            required>

                    </div>



                    <div class="mb-3">

                        <label for="descripcion" class="form-label">
                            Descripción
                        </label>

                        <textarea class="form-control" id="descripcion" rows="4" placeholder="Describa la situación..."
                            required></textarea>

                    </div>



                    <div class="mb-3">

                        <label for="estacion" class="form-label">
                            Estación
                        </label>

                        <input type="text" class="form-control" id="estacion" placeholder="Ej: E-014" required>

                    </div>


                    <!-- Ubicación -->
                    <div class="mb-3">

                        <label for="ubicacion" class="form-label">
                            Ubicación
                        </label>

                        <input type="text" class="form-control" id="ubicacion" placeholder="Ej: Río Marapa · Graneros"
                            required>

                    </div>


                    <div class="d-flex gap-2">

                        <button type="submit" class="btn btn-primary">

                            <i class="bi bi-plus-circle"></i>

                            Agregar alerta

                        </button>

                        <a href="alertas.html" class="btn btn-secondary">

                            Cancelar

                        </a>

                    </div>

                </form>

            </div>

        </div>


    </main>

    <footer class="bg-light border-top mt-5">
        <div class="container py-4">
            <div class="row align-items-center">

                <div class="col-md-4 text-center text-md-start mb-3 mb-md-0">
                    <img src="../image/logogota..png" alt="Logo SIAI Tucumán"
                        style="width: 40px; height: 40px; margin-right: 8px;">
                    <span class="fw-bold text-primary">SIAI Tucumán</span>
                </div>


                <div class="col-md-4 text-center mb-3 mb-md-0">
                    <p class="mb-0 text-secondary">
                        &copy; 2026 SIAI Tucumán <br>
                        Todos los derechos reservados
                    </p>
                </div>

                <div class="col-md-4 text-center text-md-end">
                    <a href="#" class="text-secondary">
                        <i class="bi bi-envelope-fill fs-5"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="alertas.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
